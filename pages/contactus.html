<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <h1>Formulario de Contacto</h1>
    </header>

    <nav>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="society.html">Sociedad</a></li>
            <li><a href="business.html">Negocios</a></li>
            <li><a href="contactus.html">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Déjanos tu mensaje</h2>
            <p>Si tienes alguna duda o comentario sobre el impacto de las tecnologías web, por favor completa el siguiente formulario.</p>

            <!-- Formulario requerido -->
            <form action="#" method="post">
                <div>
                    <label for="nombre">Nombre completo:</label><br>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <br>
                <div>
                    <label for="correo">Correo electrónico:</label><br>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <br>
                <div>
                    <label for="asunto">Asunto:</label><br>
                    <input type="text" id="asunto" name="asunto" required>
                </div>
                <br>
                <div>
                    <label for="mensaje">Mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="5" cols="40" required></textarea>
                </div>
                <br>
                <button type="submit">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Sitio web desarrollado para la asignatura de Tecnologías Web.</p>
    </footer>

</body>
</html>
